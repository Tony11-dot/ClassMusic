name: ClassMusic
options:
  bundleIdPrefix: com.classmate
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    DEVELOPMENT_TEAM: NNFD7CKGLG
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    APP_GROUP_ID: group.com.classmate.music

targets:
  ClassMusic:
    type: application
    platform: iOS
    sources:
      - path: ClassMusic
      - path: Shared
    dependencies:
      - target: ClassMusicWidgetExtension
        embed: true
    entitlements:
      path: ClassMusic/ClassMusic.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.classmate.music
        # TODO(CarPlay): com.apple.developer.carplay-audio needs to be
        # requested from Apple (https://developer.apple.com/contact/carplay/)
        # before this can be re-added — confirmed by testing: a real
        # device/TestFlight archive hard-fails signing with "Entitlement
        # com.apple.developer.carplay-audio not found and could not be
        # included in profile" until the account has been granted it. Local
        # simulator builds work fine without it (no provisioning profile
        # involved), which is how the CarPlay code itself was verified.
        # Once granted: uncomment the line below, then in Xcode ->
        # Signing & Capabilities -> + Capability -> CarPlay, or just let
        # automatic signing regenerate the profile on the next archive.
        # com.apple.developer.carplay-audio: true
    info:
      path: ClassMusic/Info.plist
      properties:
        CFBundleDisplayName: ClassMusic
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          # No UIWindowSceneSessionRoleApplication entry here on purpose —
          # AppDelegate.configurationForConnecting returns a plain
          # UISceneConfiguration (no delegateClass override) for that role,
          # which leaves SwiftUI's own App lifecycle handling the phone
          # window exactly as before. Only CarPlay gets a custom delegate.
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneConfigurationName: CarPlay Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        YOUTUBE_API_KEY: $(YOUTUBE_API_KEY)
        BACKEND_BASE_URL: $(BACKEND_BASE_URL)
        BACKEND_API_KEY: $(BACKEND_API_KEY)
        # Only standard HTTPS/TLS is used (no proprietary crypto), so this
        # skips the export-compliance question App Store Connect otherwise
        # asks on every single TestFlight/App Store upload.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.classmate.music
        PRODUCT_NAME: ClassMusic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testPlans: []
      config: Debug

  ClassMusicWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ClassMusicWidget
      - path: Shared
    entitlements:
      path: ClassMusicWidget/ClassMusicWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.classmate.music
    info:
      path: ClassMusicWidget/Info.plist
      properties:
        CFBundleDisplayName: ClassMusic Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.classmate.music.widget
        PRODUCT_NAME: ClassMusicWidget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true

schemes:
  ClassMusic:
    build:
      targets:
        ClassMusic: all
    run:
      config: Debug
    archive:
      config: Release
